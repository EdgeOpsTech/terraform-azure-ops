name: "Deploy Bootstrap - Dev"

on:
  push:
    branches:
      - main
    paths:
      - 'bootstrap/**'
  pull_request:
    paths:
      - 'bootstrap/**'
  workflow_dispatch:

jobs:
  deploy-bootstrap-dev:
    uses: ./.github/workflows/tf-plan-apply.yml
    with:
      working_dir: "bootstrap"
      environment: "dev"
    secrets:
      ARM_CLIENT_ID_DEV: ${{ secrets.ARM_CLIENT_ID_DEV }}
      ARM_CLIENT_ID_NONPROD: ${{ secrets.ARM_CLIENT_ID_NONPROD }}
      ARM_CLIENT_ID_PROD: ${{ secrets.ARM_CLIENT_ID_PROD }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}