name: "Sync Secrets to Repo"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository (name or owner/name)"
        required: true
        type: string
      include_pat:
        description: "Also sync GH_PAT secret"
        required: false
        default: false
        type: boolean
      include_slack:
        description: "Also sync SLACK_BOT_TOKEN secret"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    name: "Sync secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate gh CLI
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT is not set in source repo secrets" >&2
            exit 1
          fi
          echo "$GH_PAT" | gh auth login --with-token

      - name: Resolve target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REPO="${{ inputs.repo }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$INPUT_REPO" == *"/"* ]]; then
            TARGET="$INPUT_REPO"
          else
            TARGET="$OWNER/$INPUT_REPO"
          fi
          if ! gh repo view "$TARGET" >/dev/null 2>&1; then
            echo "Target repository not found or inaccessible: $TARGET" >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Sync core secrets
        shell: bash
        env:
          TARGET_REPO: ${{ steps.target.outputs.target }}
          ARM_CLIENT_ID_DEV: ${{ secrets.ARM_CLIENT_ID_DEV }}
          ARM_CLIENT_ID_NONPROD: ${{ secrets.ARM_CLIENT_ID_NONPROD }}
          ARM_CLIENT_ID_PROD: ${{ secrets.ARM_CLIENT_ID_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          set -euo pipefail
          for key in ARM_CLIENT_ID_DEV ARM_CLIENT_ID_NONPROD ARM_CLIENT_ID_PROD ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            val="${!key:-}"
            if [[ -z "$val" ]]; then
              echo "Warning: $key is not set in source repo; skipping." >&2
              continue
            fi
            gh secret set "$key" --repo "$TARGET_REPO" --app actions --body "$val"
          done

          # Also set legacy ARM_CLIENT_ID using the DEV secret for backward compatibility
          if [[ -n "${ARM_CLIENT_ID_DEV:-}" ]]; then
            gh secret set ARM_CLIENT_ID --repo "$TARGET_REPO" --app actions --body "$ARM_CLIENT_ID_DEV"
          else
            echo "Warning: ARM_CLIENT_ID_DEV not set; skipping legacy ARM_CLIENT_ID." >&2
          fi

      - name: Sync optional secrets
        if: inputs.include_pat == true || inputs.include_slack == true
        shell: bash
        env:
          TARGET_REPO: ${{ steps.target.outputs.target }}
          GH_PAT_SECRET: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INCLUDE_PAT: ${{ inputs.include_pat }}
          INCLUDE_SLACK: ${{ inputs.include_slack }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_PAT" == "true" && -n "${GH_PAT_SECRET:-}" ]]; then
            gh secret set GH_PAT --repo "$TARGET_REPO" --app actions --body "$GH_PAT_SECRET"
          fi
          if [[ "$INCLUDE_SLACK" == "true" && -n "${SLACK_BOT_TOKEN:-}" ]]; then
            gh secret set SLACK_BOT_TOKEN --repo "$TARGET_REPO" --app actions --body "$SLACK_BOT_TOKEN"
          fi

      - name: Summary
        run: echo "Secrets synced to ${{ steps.target.outputs.target }}"
