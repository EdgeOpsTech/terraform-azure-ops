name: "Terraform Plan/Apply"

# This workflow supports the new backend configuration structure:
# - Bootstrap: Uses backend/bootstrap-<env>.tfbackend and environments/<env>.tfvars
# - Infrastructure: Uses backend/<env>.tfbackend and environments/<env>.tfvars
# 
# Usage examples:
# - Deploy bootstrap to dev: working_dir="bootstrap", environment="dev"
# - Deploy infra to test: working_dir="infra", environment="test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      working_dir:
        required: false
        type: string
        default: "infra"
        description: "Working directory (bootstrap or infra)"
      environment:
        required: false
        type: string
        default: "dev"
        description: "Environment to deploy (dev, test, stage, prod)"
      tf_vars_file:
        required: false
        type: string
        default: ""
        description: "Custom tfvars file path (optional - defaults to environments/<env>.tfvars)"
    secrets:
      ARM_CLIENT_ID_DEV:
        required: false
      ARM_CLIENT_ID_NONPROD:
        required: false
      ARM_CLIENT_ID_PROD:
        required: false
      ARM_CLIENT_ID: # legacy fallback
        required: false
      ARM_SUBSCRIPTION_ID:
        required: true
      ARM_TENANT_ID:
        required: true
      GH_PAT:
        required: true
      SLACK_BOT_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      WORKING_DIR: ${{ inputs.working_dir != '' && inputs.working_dir || 'infra' }}
      ARM_CLIENT_ID: ${{ inputs.environment == 'prod' && (secrets.ARM_CLIENT_ID_PROD || secrets.ARM_CLIENT_ID) || inputs.environment == 'dev' && (secrets.ARM_CLIENT_ID_DEV || secrets.ARM_CLIENT_ID) || (secrets.ARM_CLIENT_ID_NONPROD || secrets.ARM_CLIENT_ID) }}
      ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
      ARM_USE_OIDC: true
      REPO_NAME: "${{ github.event.repository.name }}"
      REPO_OWNER: "${{ github.repository_owner }}"
      ARM_SKIP_PROVIDER_REGISTRATION: true
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject source‑repo tag for Terraform
        run: |
          echo "{\"source_repo\":\"${GITHUB_REPOSITORY}\"}" \
            > source_tags.auto.tfvars.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup GitHub access for private modules
        run: |
          echo -e "machine github.com\nlogin ${{ secrets.GH_PAT }}\npassword x-oauth-basic" > ~/.netrc

      - name: Check if working directory exists
        run: test -d "${{ env.WORKING_DIR }}" || (echo "Directory ${{ env.WORKING_DIR }} not found!" && exit 1)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          echo "Initializing Terraform with backend configuration for ${{ inputs.environment }} environment..."
          BACKEND_CONFIG="backend/${{ inputs.environment }}.tfbackend"
          
          if [ "${{ env.WORKING_DIR }}" = "bootstrap" ]; then
            BACKEND_CONFIG="backend/bootstrap-${{ inputs.environment }}.tfbackend"
          fi
          
          echo "Using backend config: $BACKEND_CONFIG"
          
          if [ ! -f "$BACKEND_CONFIG" ]; then
            echo "❌ Backend configuration file not found: $BACKEND_CONFIG"
            echo "📋 Available backend configs:"
            ls -la backend/ || echo "No backend directory found"
            exit 1
          fi
          
          echo "🚀 Running: terraform init -backend-config=\"$BACKEND_CONFIG\" -input=false"
          if ! terraform init -backend-config="$BACKEND_CONFIG" -input=false; then
            echo "❌ Terraform init failed. This might be due to missing OIDC federated identity credentials."
            echo "📋 To fix this issue:"
            echo "1. Apply the bootstrap configuration locally first to create OIDC setup"
            echo "2. Run: cd bootstrap && terraform apply -var-file='environments/${{ inputs.environment }}.tfvars'"
            echo "3. Then re-run this workflow"
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: ${{ env.WORKING_DIR }}

      # - name: Terraform Plan
      #   id: tf-plan
      #   run: |
      #     export exitcode=0
      #     terraform plan \
      #       -var="github_owner=${{ env.REPO_OWNER }}" \
      #       -var="github_repo=${{ env.REPO_NAME }}" \
      #       -detailed-exitcode -no-color -out tfplan || export exitcode=$?
      #     echo "exitcode=$exitcode" >> $GITHUB_OUTPUT

      #     if [ $exitcode -eq 1 ]; then
      #       echo Terraform Plan Failed!
      #       exit 1
      #     else
      #       exit 0
      #     fi
      #   working-directory: infra

      # … up above …
      - name: Terraform Plan
        id: tf-plan
        run: |
          export exitcode=0

          # Build terraform plan command with environment-specific vars file and colors
          PLAN_CMD="terraform plan -detailed-exitcode -out tfplan -input=false"
          
          # Use custom tf_vars_file if provided, otherwise use environment-specific file
          if [ -n "${{ inputs.tf_vars_file }}" ] && [ -f "${{ inputs.tf_vars_file }}" ]; then
            PLAN_CMD="$PLAN_CMD -var-file=${{ inputs.tf_vars_file }}"
            echo "📄 Using custom vars file: ${{ inputs.tf_vars_file }}"
          else
            # Use environment-specific vars file
            ENV_VARS_FILE="environments/${{ inputs.environment }}.tfvars"
            if [ -f "$ENV_VARS_FILE" ]; then
              PLAN_CMD="$PLAN_CMD -var-file=$ENV_VARS_FILE"
              echo "📄 Using environment vars file: $ENV_VARS_FILE"
            else
              echo "❌ Environment vars file not found: $ENV_VARS_FILE"
              echo "📋 Available environment files:"
              ls -la environments/ || echo "No environments directory found"
              exit 1
            fi
          fi

          echo "🚀 Running: $PLAN_CMD"
          eval $PLAN_CMD || export exitcode=$?
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT

          if [ $exitcode -eq 1 ]; then
            echo "❌ Terraform Plan Failed!"
            exit 1
          elif [ $exitcode -eq 2 ]; then
            echo "✅ Terraform Plan completed with changes detected"
            exit 0
          else 
            echo "✅ Terraform Plan completed with no changes"
            exit 0
          fi
        working-directory: ${{ env.WORKING_DIR }}

      - name: Publish Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

      - name: Create Terraform Summary Output
        id: tf-plan-string
        run: |
          set +e  # allow script to continue on error
          PLAN_PATH=tfplan

          if [ ! -f "$PLAN_PATH" ]; then
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "⚠️ tfplan file is missing. Skipping summary." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          terraform show -no-color "$PLAN_PATH" > tf_output.txt 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "⚠️ tfplan exists but could not be parsed." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          CREATE_COUNT=$(grep -cE 'will be created' tf_output.txt || true)
          UPDATE_COUNT=$(grep -cE 'will be updated in-place|will be changed' tf_output.txt || true)
          DESTROY_COUNT=$(grep -cE 'will be destroyed' tf_output.txt || true)

          delimiter="$(openssl rand -hex 8)"
          echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
          echo "## Terraform Plan Output" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Summary:** \`Plan: ${CREATE_COUNT} to add, ${UPDATE_COUNT} to change, ${DESTROY_COUNT} to destroy.\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "- 🟢 **Create**: ${CREATE_COUNT}" >> $GITHUB_OUTPUT
          echo "- 🟡 **Update**: ${UPDATE_COUNT}" >> $GITHUB_OUTPUT
          echo "- 🔴 **Destroy**: ${DESTROY_COUNT}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "<details><summary>Click to expand full plan</summary>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```terraform' >> $GITHUB_OUTPUT
          cat tf_output.txt >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "</details>" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
        working-directory: ${{ env.WORKING_DIR }}

      # - name: Create Terraform Summary Output
      #   id: tf-plan-string
      #   run: |
      #     set +e
      #     PLAN_PATH=tfplan

      #     if [ ! -f "${PLAN_PATH}" ]; then
      #       echo "summary<<EOF" >> $GITHUB_OUTPUT
      #       echo "⚠️ tfplan file is missing. Skipping summary." >> $GITHUB_OUTPUT
      #       echo "EOF" >> $GITHUB_OUTPUT
      #       exit 0
      #     fi

      #     terraform show -no-color "${PLAN_PATH}" > tf_output.txt 2>/dev/null
      #     if [ $? -ne 0 ]; then
      #       echo "summary<<EOF" >> $GITHUB_OUTPUT
      #       echo "⚠️ tfplan exists but could not be parsed." >> $GITHUB_OUTPUT
      #       echo "EOF" >> $GITHUB_OUTPUT
      #       exit 0
      #     fi

      #     CREATE_COUNT=$(grep -cE '^\s*#.*will be created' tf_output.txt || true)
      #     UPDATE_COUNT=$(grep -cE '^\s*#.*will be (updated in-place|changed)' tf_output.txt || true)
      #     DESTROY_COUNT=$(grep -cE '^\s*#.*will be destroyed' tf_output.txt || true)

      #     delimiter=$(openssl rand -hex 8)
      #     echo "summary<<${delimiter}" >> $GITHUB_OUTPUT

      #     # Color-coded summary header
      #     echo "<h2>Terraform Plan Output</h2>" >> $GITHUB_OUTPUT
      #     echo "<strong>Summary:</strong> " >> $GITHUB_OUTPUT
      #     echo "<span style='color: #2ECC40;'>🟢 ${CREATE_COUNT} to add</span>, " >> $GITHUB_OUTPUT
      #     echo "<span style='color: #FFDC00;'>🟡 ${UPDATE_COUNT} to change</span>, " >> $GITHUB_OUTPUT
      #     echo "<span style='color: #FF4136;'>🔴 ${DESTROY_COUNT} to destroy</span><br><br>" >> $GITHUB_OUTPUT

      #     # Color-coded details sections
      #     echo "<details open><summary>🟢 <strong>Create</strong>: ${CREATE_COUNT}</summary>" >> $GITHUB_OUTPUT
      #     echo '<pre style="color: #2ECC40;">' >> $GITHUB_OUTPUT
      #     grep -E '^\s*#.*will be created' tf_output.txt | sed 's/^/🟢 /' || echo "No resources to create." >> $GITHUB_OUTPUT
      #     echo '</pre></details><br>' >> $GITHUB_OUTPUT

      #     echo "<details><summary>🟡 <strong>Update</strong>: ${UPDATE_COUNT}</summary>" >> $GITHUB_OUTPUT
      #     echo '<pre style="color: #FFDC00;">' >> $GITHUB_OUTPUT
      #     grep -E '^\s*#.*will be (updated in-place|changed)' tf_output.txt | sed 's/^/🟡 /' || echo "No resources to update." >> $GITHUB_OUTPUT
      #     echo '</pre></details><br>' >> $GITHUB_OUTPUT

      #     echo "<details><summary>🔴 <strong>Destroy</strong>: ${DESTROY_COUNT}</summary>" >> $GITHUB_OUTPUT
      #     echo '<pre style="color: #FF4136;">' >> $GITHUB_OUTPUT
      #     grep -E '^\s*#.*will be destroyed' tf_output.txt | sed 's/^/🔴 /' || echo "No resources to destroy." >> $GITHUB_OUTPUT
      #     echo '</pre></details><br>' >> $GITHUB_OUTPUT

      #     # Full plan with ANSI color codes
      #     echo "<details><summary>📜 <strong>Full Terraform Plan</strong></summary>" >> $GITHUB_OUTPUT
      #     echo '<pre>' >> $GITHUB_OUTPUT
      #     sed -e 's/\(#.*will be created\)/\x1b[32m\1\x1b[0m/' \
      #         -e 's/\(#.*will be updated in-place\)/\x1b[33m\1\x1b[0m/' \
      #         -e 's/\(#.*will be destroyed\)/\x1b[31m\1\x1b[0m/' \
      #         tf_output.txt >> $GITHUB_OUTPUT
      #     echo '</pre></details>' >> $GITHUB_OUTPUT

      #     echo "${delimiter}" >> $GITHUB_OUTPUT
      #   working-directory: ${{ env.WORKING_DIR }}
      - name: Push Terraform Output to PR
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
        uses: actions/github-script@v7
        env:
          SUMMARY: "${{ steps.tf-plan-string.outputs.summary }}"
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const body = `${process.env.SUMMARY}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  terraform-apply:
    name: "Terraform Apply"
    if: |
      needs.terraform-plan.outputs.tfplanExitCode == 2 && (
        github.ref == 'refs/heads/main' || 
        github.ref == 'refs/heads/dev' ||
        (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
        (inputs.environment == 'test' && github.ref == 'refs/heads/main') ||
        (inputs.environment == 'stage' && startsWith(github.ref, 'refs/heads/release/')) ||
        (inputs.environment == 'prod' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: ${{ inputs.working_dir != '' && inputs.working_dir || 'infra' }}
      ARM_CLIENT_ID: ${{ inputs.environment == 'prod' && (secrets.ARM_CLIENT_ID_PROD || secrets.ARM_CLIENT_ID) || inputs.environment == 'dev' && (secrets.ARM_CLIENT_ID_DEV || secrets.ARM_CLIENT_ID) || (secrets.ARM_CLIENT_ID_NONPROD || secrets.ARM_CLIENT_ID) }}
      ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
      ARM_USE_OIDC: true
      REPO_NAME: "${{ github.event.repository.name }}"
      REPO_OWNER: "${{ github.repository_owner }}"
      ARM_SKIP_PROVIDER_REGISTRATION: true
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
    environment: ${{ inputs.environment }}
    needs: [terraform-plan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject source‑repo tag for Terraform
        run: |
          echo "{\"source_repo\":\"${GITHUB_REPOSITORY}\"}" \
            > source_tags.auto.tfvars.json
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup GitHub access for private modules
        run: |
          echo -e "machine github.com\nlogin ${{ secrets.GH_PAT }}\npassword x-oauth-basic" > ~/.netrc

      - name: Check if working directory exists
        run: test -d "${{ env.WORKING_DIR }}" || (echo "Directory ${{ env.WORKING_DIR }} not found!" && exit 1)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          echo "Initializing Terraform with backend configuration for ${{ inputs.environment }} environment..."
          BACKEND_CONFIG="backend/${{ inputs.environment }}.tfbackend"
          
          if [ "${{ env.WORKING_DIR }}" = "bootstrap" ]; then
            BACKEND_CONFIG="backend/bootstrap-${{ inputs.environment }}.tfbackend"
          fi
          
          echo "Using backend config: $BACKEND_CONFIG"
          
          if [ ! -f "$BACKEND_CONFIG" ]; then
            echo "❌ Backend configuration file not found: $BACKEND_CONFIG"
            echo "📋 Available backend configs:"
            ls -la backend/ || echo "No backend directory found"
            exit 1
          fi
          
          echo "🚀 Running: terraform init -backend-config=\"$BACKEND_CONFIG\" -input=false"
          if ! terraform init -backend-config="$BACKEND_CONFIG" -input=false; then
            echo "❌ Terraform init failed. This might be due to missing OIDC federated identity credentials."
            echo "📋 To fix this issue:"
            echo "1. Apply the bootstrap configuration locally first to create OIDC setup"
            echo "2. Run: cd bootstrap && terraform apply -var-file='environments/${{ inputs.environment }}.tfvars'"
            echo "3. Then re-run this workflow"
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: ${{ env.WORKING_DIR }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: |
          echo "🚀 Running: terraform apply -auto-approve tfplan"
          terraform apply -auto-approve tfplan
        working-directory: ${{ env.WORKING_DIR }}

  notify-slack-plan-failure:
    name: Notify Slack on Terraform PlanFailure
    needs: [terraform-plan, terraform-apply]
    if: ${{ failure() }} # ✅ Ensure it only runs if above job fails
    uses: EdgeOpsTech/edgeops-slack/.github/workflows/notify-slack.yml@main
    with:
      job_name: "Terraform Plan/Apply"
      run_id: ${{ github.run_id }}
      channel: "ci-cd-alerts"
      error_message: "Terraform Plan failed in ${{ github.repository }}"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
